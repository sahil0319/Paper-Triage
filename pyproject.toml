[project]
name = "paper-triage"
version = "0.1.0"
description = "Paper Triage Assistant"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "uvicorn",
  "httpx",
  "pydantic>=2",
  "anthropic",
  "pypdf",
  "openai>=3.22.1",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-playwright>=0.9.0",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paper_triage"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["e2e: real-browser tests (need chromium)"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
